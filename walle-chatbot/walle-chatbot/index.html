<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WALL-E · Chatbot de Reciclagem</title>
  <meta name="description" content="Chatbot simples que tira dúvidas sobre reciclagem e separação do lixo.">

  <!-- Fontes (se estiver sem internet, o navegador usa fontes padrão) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desenho do robô (avatar original), definido uma vez e reutilizado com <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="robo-avatar" viewBox="0 0 64 64">
      <!-- Antena com um brotinho verde -->
      <line x1="32" y1="14" x2="32" y2="6" stroke="#3a2515" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M32 7 C26 6 23 2 24 0 C28 0 31 3 32 7 Z" fill="#7fb24a" stroke="#3a2515" stroke-width="1.2"/>
      <path d="M32 7 C37 5 40 1 39 -1 C35 -1 33 2 32 7 Z" fill="#9cc95f" stroke="#3a2515" stroke-width="1.2"/>
      <!-- Parafusos laterais (orelhas) -->
      <rect x="4" y="28" width="7" height="14" rx="3" fill="#a0602a" stroke="#3a2515" stroke-width="2"/>
      <rect x="53" y="28" width="7" height="14" rx="3" fill="#a0602a" stroke="#3a2515" stroke-width="2"/>
      <!-- Cabeça -->
      <rect x="9" y="14" width="46" height="42" rx="12" fill="#e5a83b" stroke="#3a2515" stroke-width="2.5"/>
      <rect x="13" y="17" width="10" height="3" rx="1.5" fill="#f6d28a"/>
      <!-- Tela do rosto -->
      <rect x="15" y="23" width="34" height="24" rx="8" fill="#3a2515"/>
      <!-- Olhos (piscam com <animate>) -->
      <rect x="21" y="29" width="7" height="9" rx="3.5" fill="#9cdc6a">
        <animate attributeName="height" values="9;9;1;9;9" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="29;29;33;29;29" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="29" width="7" height="9" rx="3.5" fill="#9cdc6a">
        <animate attributeName="height" values="9;9;1;9;9" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="29;29;33;29;29" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <!-- Sorriso -->
      <path d="M28 41 Q32 44 36 41" fill="none" stroke="#9cdc6a" stroke-width="2" stroke-linecap="round"/>
      <!-- Bochechas -->
      <circle cx="17" cy="50" r="2" fill="#c8742c"/>
      <circle cx="47" cy="50" r="2" fill="#c8742c"/>
    </symbol>
  </svg>

  <main class="chat">

    <!-- Cabeçalho com avatar e nome do bot -->
    <header class="chat-cabecalho">
      <div class="avatar avatar-grande">
        <svg viewBox="0 -2 64 66" aria-hidden="true"><use href="#robo-avatar"></use></svg>
      </div>
      <div class="chat-titulo">
        <h1>WALL-E</h1>
        <p class="status"><span class="status-ponto"></span> Online · robô reciclador</p>
      </div>
    </header>

    <!-- Área onde as mensagens aparecem -->
    <section id="mensagens" class="mensagens" aria-live="polite" aria-label="Conversa com o WALL-E"></section>

    <!-- Botões de perguntas rápidas -->
    <nav class="sugestoes" aria-label="Perguntas rápidas">
      <button type="button" class="sugestao">Como separar o lixo?</button>
      <button type="button" class="sugestao">O que significam as cores das lixeiras?</button>
      <button type="button" class="sugestao">O que não pode ser reciclado?</button>
      <button type="button" class="sugestao">Onde descartar pilhas?</button>
      <button type="button" class="sugestao">Como fazer compostagem?</button>
      <button type="button" class="sugestao">Dicas para reduzir o lixo</button>
    </nav>

    <!-- Campo de texto e botão de enviar -->
    <form id="formulario" class="formulario" autocomplete="off">
      <label for="campo-texto" class="oculto">Digite sua pergunta</label>
      <input id="campo-texto" type="text" placeholder="Pergunte algo sobre reciclagem..." maxlength="200">
      <button type="submit" class="botao-enviar" aria-label="Enviar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 20 4l-7.5 17-2.2-7.3L3 11.5Z" fill="currentColor"/></svg>
      </button>
    </form>

  </main>

  <script src="script.js"></script>
</body>
</html>
